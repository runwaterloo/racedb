additionalArguments:
  - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
  - --certificatesresolvers.le.acme.email=sl70176@gmail.com
  - --certificatesresolvers.le.acme.storage=/data/acme.json
  # Trust only Cloudflare edge IPs for X-Forwarded-* headers. Replaces the old
  # forwardedHeaders.insecure=true, which let any client spoof X-Forwarded-For
  # (and thereby the rate limiter's per-IP bucket). Harmless until Cloudflare
  # proxies the zone; required before flipping to proxied.
  # Ranges from https://www.cloudflare.com/ips/ — re-check yearly.
  - --entryPoints.web.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22
  - --entryPoints.websecure.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22
  - --metrics.prometheus=true
  - --metrics.prometheus.entryPoint=metrics
env:
  - name: CF_DNS_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-secrets
        key: apiToken
log:
  format: json
accessLog:
  enabled: true
  format: json
  fields:
    defaultMode: keep
    headers:
      names:
        Referer: keep
        Cf-Ray: keep
persistence:
  existingClaim: traefik-pvc
  enabled: true
  path: /data
service:
  spec:
    externalTrafficPolicy: Local
ports:
  metrics:
    expose:
      default: true
