alloy:
  configMap:
    create: true
    content: |

      ///////////////////////////////////////////////////////////////////////////////////
      // Prometheus writer
      prometheus.remote_write "grafanacloud" {
        endpoint {
          url = "https://prometheus-prod-32-prod-ca-east-0.grafana.net/api/prom/push"

          basic_auth {
            username = sys.env("PROM_USERNAME")
            password = sys.env("GRAFANA_API_TOKEN")
          }
        }
      }
      ///////////////////////////////////////////////////////////////////////////////////

      ///////////////////////////////////////////////////////////////////////////////////
      // Loki writer
      loki.write "grafanacloud" {
        endpoint {
          url = "https://logs-prod-018.grafana.net/loki/api/v1/push"

          basic_auth {
            username = sys.env("LOKI_USERNAME")
            password = sys.env("GRAFANA_API_TOKEN")
          }
        }
      }
      ///////////////////////////////////////////////////////////////////////////////////

      ///////////////////////////////////////////////////////////////////////////////////
      // Node exporter scraper
      prometheus.scrape "unix" {
        targets = prometheus.exporter.unix.localhost.targets
        forward_to = [prometheus.relabel.set_labels.receiver]
      }
      ///////////////////////////////////////////////////////////////////////////////////

      ///////////////////////////////////////////////////////////////////////////////////
      // Process scraper
      prometheus.scrape "processes" {
        targets    = prometheus.exporter.process.processes.targets
        forward_to = [prometheus.remote_write.grafanacloud.receiver]
      }
      ///////////////////////////////////////////////////////////////////////////////////

      ///////////////////////////////////////////////////////////////////////////////////
      // Drop racedbdev metrics at ingest to cut Grafana Cloud cardinality.
      // source_labels in a rule are CONCATENATED with ; and matched whole,
      // so one rule per label — each drops when that label is racedbdev.
      // Logs are unaffected: this only touches the prometheus pipeline.
      prometheus.relabel "drop_racedbdev" {
        forward_to = [prometheus.remote_write.grafanacloud.receiver]
        rule {
          source_labels = ["datname"]
          regex         = "racedbdev"
          action        = "drop"
        }
        rule {
          source_labels = ["user"]
          regex         = "racedbdev"
          action        = "drop"
        }
        rule {
          source_labels = ["rolname"]
          regex         = "racedbdev"
          action        = "drop"
        }
        rule {
          source_labels = ["usename"]
          regex         = "racedbdev"
          action        = "drop"
        }
        rule {
          source_labels = ["service"]
          regex         = ".*racedbdev.*"
          action        = "drop"
        }
      }
      ///////////////////////////////////////////////////////////////////////////////////

      ///////////////////////////////////////////////////////////////////////////////////
      // Traefik scraper
      prometheus.scrape "traefik" {
        targets = [
          {"__address__" = "traefik:9100", "instance" = "traefik"},
        ]
        forward_to = [prometheus.relabel.drop_racedbdev.receiver]
      }
      ///////////////////////////////////////////////////////////////////////////////////

      prometheus.exporter.unix "localhost" {
        procfs_path = "/host/proc"
        sysfs_path  = "/host/sys"
        rootfs_path = "/rootfs"
        include_exporter_metrics = true
      }

      prometheus.relabel "set_labels" {
        forward_to = [prometheus.remote_write.grafanacloud.receiver]
        rule {
          action = "replace"
          target_label = "nodename"
          replacement = "rrw"
        }
      }

      prometheus.exporter.process "processes" {
        procfs_path = "/host/proc"
        matcher {
          comm = ["alloy", "celery", "containerd", "containerd-shim", "coredns", "gunicorn", "k3s-server", "metrics-server", "node_exporter", "prometheus-conf", "python", "redis-server", "traefik"]
        }
       }

      // discovery.kubernetes allows you to find scrape targets from Kubernetes resources.
      // It watches cluster state and ensures targets are continually synced with what is currently running in your cluster.
      discovery.kubernetes "pod" {
        role = "pod"
      }

      // discovery.relabel rewrites the label set of the input targets by applying one or more relabeling rules.
      // If no rules are defined, then the input targets are exported as-is.
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pod.targets

        // Label creation - "pod" field from "__meta_kubernetes_pod_name"
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          action = "replace"
          target_label = "pod"
        }

        // Default env for pods that aren't part of the racedb chart (traefik,
        // postgres, coredns, alloy are all prod). The racedbdev rule overwrites
        // this below.
        rule {
          action = "replace"
          target_label = "env"
          replacement = "prod"
        }

        // NOTE: we do NOT read __meta_kubernetes_pod_label_* here. Alloy >= 1.8.0
        // stopped exposing pod-label metas in this pipeline
        // (github.com/grafana/alloy/issues/3311), so everything below derives
        // from the pod NAME, which reliably encodes release, component and env:
        //   racedb-web-<rs>-<rand>       prod web
        //   racedbdev-celery-<rs>-<rand> dev  celery
        //   racedb-cronjob-traefik-...   prod cert-backup cron

        // component = web | celery | beat | redis for the chart's deployments.
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          action = "replace"
          regex = "racedbdev?-(web|celery|beat|redis)-.*"
          replacement = "$1"
          target_label = "component"
        }

        // The racedb chart also deploys the traefik cert-backup cronjob.
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          action = "replace"
          regex = "racedb-cronjob-traefik-.*"
          replacement = "traefik-cron"
          target_label = "component"
        }

        // job = racedb for everything the racedb chart deploys, prod and dev;
        // env distinguishes the two.
        // service_name = job, set explicitly below: Loki's fallback order prefers
        // component over job, which would give per-component service names
        // and split prod/dev in the service views.
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          action = "replace"
          regex = "racedb(dev)?-.*"
          replacement = "racedb"
          target_label = "job"
        }

        // env=dev for racedbdev pods; the default rule above covers the rest.
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          action = "replace"
          regex = "racedbdev-.*"
          replacement = "dev"
          target_label = "env"
        }

        // Non-chart workloads: static job/component/env. The traefik proxy, postgres,
        // coredns and alloy itself are not labeled by us, so match on namespace +
        // container name and hard-code their labels.
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          action = "replace"
          regex = "default;traefik"
          replacement = "traefik"
          target_label = "job"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          action = "replace"
          regex = "default;traefik"
          replacement = "traefik"
          target_label = "component"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          action = "replace"
          regex = "default;postgres"
          replacement = "postgres"
          target_label = "job"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          action = "replace"
          regex = "default;postgres"
          replacement = "postgres"
          target_label = "component"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          action = "replace"
          regex = "kube-system;coredns"
          replacement = "coredns"
          target_label = "job"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          action = "replace"
          regex = "kube-system;coredns"
          replacement = "coredns"
          target_label = "component"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          action = "replace"
          regex = "default;alloy"
          replacement = "alloy"
          target_label = "job"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          action = "replace"
          regex = "default;alloy"
          replacement = "alloy"
          target_label = "component"
        }

        // service_name = job on every stream, set AFTER all job rules. Explicit
        // because Loki's service_name fallback prefers component over job, which
        // would give per-component service names (web, celery, ...) and merge
        // prod/dev in the Grafana service views. Same value as job: no extra
        // cardinality.
        rule {
          source_labels = ["job"]
          action = "replace"
          target_label = "service_name"
        }

        // Label creation - "container" field from "__meta_kubernetes_pod_uid" and "__meta_kubernetes_pod_container_name"
        // Concatenate values __meta_kubernetes_pod_uid/__meta_kubernetes_pod_container_name.log
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          action = "replace"
          target_label = "__path__"
          separator = "/"
          replacement = "/var/log/pods/*$1/*.log"
        }

      }

      // loki.source.kubernetes tails logs from Kubernetes containers using the Kubernetes API.
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pod_logs.receiver]
      }

      // loki.process receives log entries from other Loki components, applies one or more processing stages,
      // and forwards the results to the list of receivers in the component's arguments.
      loki.process "pod_logs" {
        // Stitch multi-line messages (e.g. Python tracebacks) back into one entry.
        // Any line NOT starting with one of these is treated as a continuation of
        // the previous line. Python tracebacks have indented lines plus bare lines
        // like "Traceback (most recent call last):" and "AttributeError: ..." —
        // they don't start with a timestamp, so they get joined to the entry above.
        stage.multiline {
          firstline     = "^(?:\\[?\\d{4}-\\d{2}-\\d{2}|ts=|time=|\\{|\\[[A-Z]|\\d+:[MC] |\\d{1,2}:\\d{2}:\\d{2}|[IWEF]\\d{4})"
          max_lines     = 200
          max_wait_time = "3s"
        }

        forward_to = [loki.write.grafanacloud.receiver]
      }

      ///////////////////////////////////////////////////////////////////////////////////
      // Discover and scrape django metrics from rrw web pods
      discovery.relabel "rrw_web_pods" {
      targets = discovery.kubernetes.pod.targets
        // Keep only pods with correct labels
        rule {
          action        = "keep"
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance", "__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          regex         = "racedb;web"
        }
        // Set instance label to pod IP
        rule {
          action        = "replace"
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:8000"
        }
      }
      prometheus.scrape "racedb_web" {
        targets    = discovery.relabel.rrw_web_pods.output
        forward_to = [prometheus.remote_write.grafanacloud.receiver]
        job_name = "django-prometheus"
      }
      ////////////////////////////////////////////////////////////////////////////////////

      ///////////////////////////////////////////////////////////////////////////////////
      // Discover and scrape redis_exporter from the racedb redis pod sidecar.
      // Only the prod redis (instance=racedb) is scraped; the dev redis
      // (racedbdev) has no exporter sidecar enabled by default.
      discovery.relabel "redis_pods" {
      targets = discovery.kubernetes.pod.targets
        rule {
          action        = "keep"
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance", "__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          regex         = "racedb;redis"
        }
        rule {
          action        = "keep"
          source_labels = ["__meta_kubernetes_pod_container_name"]
          regex         = "redis-exporter"
        }
        rule {
          action        = "replace"
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:9121"
        }
      }
      prometheus.scrape "redis" {
        targets    = discovery.relabel.redis_pods.output
        forward_to = [prometheus.remote_write.grafanacloud.receiver]
        job_name   = "redis"
      }
      discovery.relabel "postgres_pods" {
      targets = discovery.kubernetes.pod.targets
        rule {
          action        = "keep"
          source_labels = ["__meta_kubernetes_pod_label_app"]
          regex         = "postgres"
        }
        rule {
          action        = "keep"
          source_labels = ["__meta_kubernetes_pod_container_name"]
          regex         = "postgres-exporter"
        }
        rule {
          action        = "replace"
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:9187"
        }
      }
      prometheus.scrape "postgres" {
        targets    = discovery.relabel.postgres_pods.output
        forward_to = [prometheus.relabel.drop_racedbdev.receiver]
        job_name   = "postgres"
      }
      ////////////////////////////////////////////////////////////////////////////////////

      ///////////////////////////////////////////////////////////////////////////////////
      // Send the underlying host journal logs to Loki
      loki.source.journal "host_journal" {
        path        = "/host/journal"
        format_as_json = true
        labels = {
          job          = "systemd-journal",
          service_name = "systemd-journal",
          env          = "prod",
        }
        forward_to = [loki.write.grafanacloud.receiver]
      }
      ///////////////////////////////////////////////////////////////////////////////////

      ///////////////////////////////////////////////////////////////////////////////////
      // OpenTelemetry traces: receive OTLP from apps, forward to Grafana Cloud
      // Tempo. Username is the shared stack instance ID (same value as
      // PROM_USERNAME / LOKI_USERNAME); auth token is GRAFANA_API_TOKEN.
      // Apps in-cluster export to http://alloy:4318 — no app-side headers.
      otelcol.receiver.otlp "racedb" {
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          traces = [otelcol.processor.transform.clean.input]
        }
      }

      // Django raises Http404 internally, which the instrumentation records as
      // an exception event with ERROR status. A 404 is a normal response, not an
      // error, so strip its exception attributes and clear the span status.
      otelcol.processor.transform "clean" {
        error_mode = "ignore"

        trace_statements {
          context = "span"
          statements = [
            `set(status.code, STATUS_CODE_OK) where attributes["http.response.status_code"] == 404 or attributes["http.status_code"] == 404`,
          ]
        }

        trace_statements {
          context = "spanevent"
          statements = [
            `delete_key(spanevent.attributes, "exception.stacktrace") where spanevent.attributes["exception.type"] == "django.http.response.Http404"`,
            `delete_key(spanevent.attributes, "exception.message") where spanevent.attributes["exception.type"] == "django.http.response.Http404"`,
            `delete_key(spanevent.attributes, "exception.escaped") where spanevent.attributes["exception.type"] == "django.http.response.Http404"`,
            `delete_key(spanevent.attributes, "exception.type") where spanevent.attributes["exception.type"] == "django.http.response.Http404"`,
          ]
        }

        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo-prod-13-prod-ca-east-0.grafana.net:443"
          auth     = otelcol.auth.basic.grafanacloud.handler
        }
      }

      otelcol.auth.basic "grafanacloud" {
        username = sys.env("TEMPO_USERNAME")
        password = sys.env("GRAFANA_API_TOKEN")
      }
      ///////////////////////////////////////////////////////////////////////////////////

  envFrom:
    - secretRef:
        name: alloy-secrets
  mounts:
    extra:
      - name: proc
        mountPath: /host/proc
        readOnly: true
      - name: sys
        mountPath: /host/sys
        readOnly: true
      - name: root
        mountPath: /rootfs
        readOnly: true
      - name: journal
        mountPath: /host/journal
        readOnly: true

controller:
  volumes:
    extra:
      - name: proc
        hostPath:
          path: /proc
      - name: sys
        hostPath:
          path: /sys
      - name: root
        hostPath:
          path: /
      - name: journal
        hostPath:
          path: /var/log/journal
    extraPorts:
      - name: otlp-http
        port: 4318
        protocol: TCP
        targetPort: 4318

extraObjects:
  - apiVersion: v1
    kind: Service
    metadata:
      name: alloy-otlp
      namespace: default
      labels:
        app.kubernetes.io/name: alloy
    spec:
      selector:
        app.kubernetes.io/name: alloy
      ports:
        - name: otlp-http
          port: 4318
          protocol: TCP
          targetPort: 4318
