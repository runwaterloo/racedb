apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: "{{ include "racedb.fullname" . }}-redirect"
spec:
  redirectScheme:
    scheme: https
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: "{{ include "racedb.fullname" . }}-rate-limit"
spec:
  rateLimit:
    average: 20
    period: 1m
    burst: 50
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: "{{ include "racedb.fullname" . }}-rate-limit-api"
spec:
  rateLimit:
    average: 100
    period: 1m
    burst: 500
