apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: "{{ include "racedb.fullname" . }}-redirect"
spec:
  redirectScheme:
    scheme: https
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: "{{ include "racedb.fullname" . }}-rate-limit"
spec:
  rateLimit:
    average: {{ .Values.ingress.rateLimit.average }}
    period: {{ .Values.ingress.rateLimit.period }}
    burst: {{ .Values.ingress.rateLimit.burst }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: "{{ include "racedb.fullname" . }}-rate-limit-api"
spec:
  rateLimit:
    average: {{ .Values.ingress.rateLimit.apiAverage }}
    period: {{ .Values.ingress.rateLimit.apiPeriod }}
    burst: {{ .Values.ingress.rateLimit.apiBurst }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: "{{ include "racedb.fullname" . }}-rate-limit-static"
spec:
  rateLimit:
    average: {{ .Values.ingress.rateLimit.staticAverage }}
    period: {{ .Values.ingress.rateLimit.staticPeriod }}
    burst: {{ .Values.ingress.rateLimit.staticBurst }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: "{{ include "racedb.fullname" . }}-rate-limit-bot"
spec:
  rateLimit:
    average: {{ .Values.ingress.rateLimit.botAverage }}
    period: {{ .Values.ingress.rateLimit.botPeriod }}
    burst: {{ .Values.ingress.rateLimit.botBurst }}
    sourceCriterion:
      requestHeaderName: User-Agent
