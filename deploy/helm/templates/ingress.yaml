{{- if .Values.ingress.enabled -}}
{{- if .Values.ingress.catchall.enabled -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: racedb-catchall
spec:
  entryPoints:
    - web
  routes:
    - match: {{ .Values.ingress.catchall.hostmatch | quote }}
      priority: 1
      kind: Rule
      services:
        - name: "{{ include "racedb.fullname" . }}"
          port: {{ .Values.service.port}}
---
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ include "racedb.fullname" . }}-insecure"
spec:
  entryPoints:
    - web
  routes:
    - match: "Host(`{{ .Values.ingress.host}}`) && !PathPrefix(`/v1`) && !PathPrefix(`/static`)"
      kind: Rule
      services:
        - name: "{{ include "racedb.fullname" . }}"
          port: {{ .Values.service.port}}
      middlewares:
        - name: "{{ include "racedb.fullname" . }}-rate-limit"
        - name: "{{ include "racedb.fullname" . }}-redirect"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ include "racedb.fullname" . }}-insecure-static"
spec:
  entryPoints:
    - web
  routes:
    - match: "Host(`{{ .Values.ingress.host}}`) && PathPrefix(`/static`)"
      kind: Rule
      services:
        - name: "{{ include "racedb.fullname" . }}"
          port: {{ .Values.service.port}}
      middlewares:
        - name: "{{ include "racedb.fullname" . }}-rate-limit-static"
        - name: "{{ include "racedb.fullname" . }}-redirect"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ include "racedb.fullname" . }}-secure"
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`{{ .Values.ingress.host}}`) && !PathPrefix(`/v1`) && !PathPrefix(`/static`)"
      kind: Rule
      services:
        - name: "{{ include "racedb.fullname" . }}"
          port: {{ .Values.service.port}}
      middlewares:
        - name: "{{ include "racedb.fullname" . }}-rate-limit"
  tls:
    certResolver: le
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ include "racedb.fullname" . }}-secure-static"
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`{{ .Values.ingress.host}}`) && PathPrefix(`/static`)"
      kind: Rule
      services:
        - name: "{{ include "racedb.fullname" . }}"
          port: {{ .Values.service.port}}
      middlewares:
        - name: "{{ include "racedb.fullname" . }}-rate-limit-static"
  tls:
    certResolver: le
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ include "racedb.fullname" . }}-secure-bot"
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`{{ .Values.ingress.host}}`) && PathPrefix(`/static`) && HeaderRegexp(`User-Agent`, `(?i)(bot|crawl|spider|slurp)`)"
      priority: 1000
      kind: Rule
      services:
        - name: "{{ include "racedb.fullname" . }}"
          port: {{ .Values.service.port}}
      middlewares:
        - name: "{{ include "racedb.fullname" . }}-rate-limit-static"
    # Longer rule wins over the plain host routes, so bot UAs are throttled
    # by the shared-UA limiter instead of the per-IP one. Static assets keep
    # their own router (see above): bots don't need to be slowed on whitenoise
    # assets, and static is already separately rate-limited.
    - match: "Host(`{{ .Values.ingress.host}}`) && HeaderRegexp(`User-Agent`, `(?i)(bot|crawl|spider|slurp)`)"
      kind: Rule
      services:
        - name: "{{ include "racedb.fullname" . }}"
          port: {{ .Values.service.port}}
      middlewares:
        - name: "{{ include "racedb.fullname" . }}-rate-limit-bot"
  tls:
    certResolver: le
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ include "racedb.fullname" . }}-secure-api"
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`{{ .Values.ingress.apiHost}}`) && (PathPrefix(`/v1`) || PathPrefix(`/admin`) || PathPrefix(`/static`))"
      kind: Rule
      services:
        - name: "{{ include "racedb.fullname" . }}"
          port: {{ .Values.service.port}}
      middlewares:
        - name: "{{ include "racedb.fullname" . }}-rate-limit-api"
  tls:
    certResolver: le
{{- end }}
