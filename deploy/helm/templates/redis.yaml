apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "racedb.fullname" . }}-redis"
  labels:
    {{- include "racedb.labels" . | nindent 4 }}
    app.kubernetes.io/task: redis
spec:
  selector:
    matchLabels:
      {{- include "racedb.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/task: redis
  replicas: 1
  template:
    metadata:
      labels:
        {{- include "racedb.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/task: redis
    spec:
      containers:
      - name: "{{ include "racedb.fullname" . }}-redis"
        image: "{{ .Values.redis.image.name }}:{{ .Values.redis.image.tag }}"
        ports:
        - containerPort: 6379
        imagePullPolicy: IfNotPresent
        # volatile-lru evicts only keys with TTLs (cache entries, celery task
        # meta) and never touches the TTL-less broker queues or cache
        # generation counter. Alert fires at 80% of maxmemory long before
        # writes start failing.
        command: ["redis-server"]
        args: ["--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
{{- if .Values.redis.exporter.enabled }}
      - name: redis-exporter
        image: "{{ .Values.redis.exporter.image.repository }}:{{ .Values.redis.exporter.image.tag }}"
        imagePullPolicy: IfNotPresent
        args:
        - "--redis.addr=redis://localhost:6379"
        ports:
        - name: http-metrics
          containerPort: 9121
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ include "racedb.fullname" . }}-redis"
  labels:
    {{- include "racedb.labels" . | nindent 4 }}
    app.kubernetes.io/task: redis
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    {{- include "racedb.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/task: redis
