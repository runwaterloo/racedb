# Default values for racedb.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
racedb:
  devVolumePath: /srv/racedb
  secretsVolumePath: /srv/racedb_secrets
  celeryWorkers: 1
  # mount local filesytem into container
  mountLocal: false
  threads: 1
  workers: 1  # prometheus reporting issues with more than 1 worker
  workerClass: gthread
  storage: s3

replicaCount: 1
webReplicaCount: 1

image:
  repository: ghcr.io/runwaterloo/racedb
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "racedb"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  catchall:
    enabled: false
    # Match any host except the elastic IP and its EC2 hostname: requests to
    # those are pure scanner traffic, so they fall through to Traefik's own 404.
    hostmatch: >-
      !(Host(`52.54.231.139`) || Host(`ec2-52-54-231-139.compute-1.amazonaws.com`))
      && Hostregexp(`.+`)
  rateLimit:
    average: 20
    period: 1m
    burst: 50
    apiAverage: 100
    apiPeriod: 1m
    apiBurst: 500

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

redis:
  image:
    name: redis
    repository: redis
    tag: 8.0.6-alpine3.21
  # redis_exporter sidecar, scraped by alloy (see deploy/alloy/values.yaml).
  # Alloy only targets instance=racedb (prod), so enabling here for dev has
  # no effect on scraped metrics.
  exporter:
    enabled: false
    image:
      repository: oliver006/redis_exporter
      tag: v1.73.0
