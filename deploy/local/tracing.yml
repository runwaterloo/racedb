# Optional local tracing stack: tempo + grafana for viewing spans like
# prod would in Grafana Cloud. Start separately from the main compose:
#   docker compose -f deploy/local/tracing.yml up -d
# then set in the racedb-web environment (see docker-compose.yml):
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
services:
  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    ports:
      - "3300:3000"
volumes:
  tempo-data:
networks:
  default:
    name: racedb-tracing
