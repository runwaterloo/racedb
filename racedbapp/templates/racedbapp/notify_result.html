<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRW Import Result</title>
<style>
  body { margin:0; padding:2rem 1rem; background:#f5f5f2; color:#1a1a2e;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; line-height:1.5; }
  .wrap { max-width:760px; margin:0 auto; }
  .card { background:#fff; border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.1);
    padding:1.5rem 2rem; margin-bottom:1.25rem; }
  h1 { font-size:1.4rem; margin:0; }
  .badge { display:inline-block; font-size:.75rem; font-weight:600; letter-spacing:.05em;
    text-transform:uppercase; color:#fff; border-radius:999px;
    padding:.2rem .6rem; vertical-align:middle; margin-left:.5rem; }
  .badge-green { background:#15803d; }
  .badge-yellow { background:#a16207; }
  .badge-red { background:#b91c1c; }
  pre { background:#1e1e2e; color:#e0e0e8; padding:1rem; border-radius:8px;
    overflow-x:auto; white-space:pre-wrap; word-break:break-word; font-size:.85rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>{{ header }} <span class="badge badge-{{ badge_class }}">{{ status }}</span></h1>
  </div>
  <div class="card">
    <pre>{{ output }}</pre>
  </div>
</div>
</body>
</html>
